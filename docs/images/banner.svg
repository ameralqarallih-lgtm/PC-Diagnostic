<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="PC Diagnostic and Incident Recorder: the black box recorder for your Windows PC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#13233f"/>
      <stop offset="1" stop-color="#1d3b66"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>
  <polyline filter="url(#glow)" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    points="0,250 180,250 230,250 250,214 270,282 292,176 314,262 336,250 520,250 560,236 600,250 760,250 790,196 815,300 840,226 860,250 1280,250"/>
  <circle cx="815" cy="300" r="7" fill="#f43f5e" filter="url(#glow)"/>
  <g transform="translate(1070 120)">
    <circle r="62" fill="none" stroke="#1e293b" stroke-width="14"/>
    <circle r="62" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-dasharray="253 390" transform="rotate(-90)"/>
    <text y="10" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">65%</text>
    <text y="36" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">CPU</text>
  </g>
  <g transform="translate(925 96)">
    <circle r="40" fill="none" stroke="#1e293b" stroke-width="10"/>
    <circle r="40" fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" stroke-dasharray="148 252" transform="rotate(-90)"/>
    <text y="7" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">59%</text>
  </g>
  <text x="64" y="118" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#title)">PC Diagnostic</text>
  <text x="66" y="160" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#7dd3fc">&amp; Incident Recorder</text>
  <text x="66" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">The black box recorder for your Windows PC: catch the problem, keep the evidence, see why.</text>
</svg>
